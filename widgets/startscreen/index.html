<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Clean Start Screen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="solid-bg"></div>

  <div class="ambient-orbs">
    <div class="orb orb-pink"></div>
    <div class="orb orb-green"></div>
  </div>

  <div class="hud-container">
    <div class="clean-card main-panel">
      <div class="status-badge">
        <span class="pulse-dot"></span> ОЖИДАНИЕ ТРАНСЛЯЦИИ
      </div>
      <h1 class="greeting-text">
        <span id="line1" class="neon-text-pink">Ало,</span>
        <span id="line2">Здравствуйте,</span>
        <span id="line3">Добрый вечер</span>
      </h1>
      <div class="footer-text">
        Заваривайте чаёк, скоро начинаем <span class="dot-spacer">•</span> <span id="starting-timer" class="accent-timer">05:00</span>
      </div>
    </div>

    <div class="clean-card chat-panel">
      <div class="chat-title">
        <span class="pulse-dot green-dot"></span> Чат трансляции
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
